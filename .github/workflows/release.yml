name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to publish (e.g. v0.1.0)'
        required: true

jobs:
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # The runner ships with npm 10.x which doesn't always handle
      # granular-token publish correctly. Upgrade to a current npm.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies (skip lifecycle hooks for speed)
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test

      - name: Publish to npm
        run: npm publish --access public

  update-formula:
    name: Update Homebrew formula SHA
    runs-on: ubuntu-latest
    needs: publish-npm
    # continue-on-error so a missing HOMEBREW_TAP_TOKEN doesn't fail the release.
    # The npm publish is the authoritative step.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Errr0rr404/homebrew-cursor-plus
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-cursor-plus

      - name: Compute npm tarball sha256
        id: sha
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          URL="https://registry.npmjs.org/cursor-plus/-/cursor-plus-${VERSION}.tgz"
          # Brief pause for npm CDN to propagate the just-published tarball.
          sleep 15
          SHA=$(curl -sL "$URL" | sha256sum | awk '{print $1}')
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Patch formula
        run: |
          cd homebrew-cursor-plus
          sed -i "s|url \".*\"|url \"${{ steps.sha.outputs.url }}\"|" Formula/cursor-plus.rb
          sed -i "s|sha256 \".*\"|sha256 \"${{ steps.sha.outputs.sha }}\"|" Formula/cursor-plus.rb

      - name: Commit updated formula
        run: |
          cd homebrew-cursor-plus
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "Update cursor-plus to v${{ steps.sha.outputs.version }}"
          git push